<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 452" width="1100" height="452" role="img" aria-labelledby="title desc">
<title id="title">present-together: one route, two roles</title>
<desc id="desc">Five steps: your talk, sharpen it, an activity, build and try, rehearse and reflect. At each step you decide: your core message, which changes you keep, your activity, your verdict on the first version and your own method card. Your agent does the technical work: it checks permitted use, names each method, offers three activity options, builds, tests and hosts with the cost stated first, and checks real devices with an offline fallback. You leave with a clearer talk, a tested activity and your own method card.</desc>
<text x="20" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" fill="#9198a1">ONE ROUTE, TWO ROLES</text>
<text x="1080" y="28" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#9198a1">you never need to code  ·  your message stays yours</text>
