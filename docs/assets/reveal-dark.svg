<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 362" width="1100" height="362" role="img" aria-labelledby="title desc">
<title id="title">Predict, then reveal: Lea's opening question</title>
<desc id="desc">Lea opens with the question: what will 1,000 euros be worth after 30 years at 5% a year? Everyone commits to a guess, then the curve appears. With interest on interest the money grows to 4,322 euros; if the interest is paid out and not reinvested, it ends at 2,500 euros.</desc>
<rect x="20" y="20" width="420" height="322" rx="16" fill="#161b22" stroke="#3d444d"/>
<text x="48" y="58" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.4" fill="#9198a1">LEA'S OPENING QUESTION</text>
<text x="48" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#f0f6fc">What will €1,000 be worth</text>
<text x="48" y="138" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#f0f6fc">after 30 years</text>
<text x="48" y="172" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="27" font-weight="700" fill="#f0f6fc">at 5% a year?</text>
<circle cx="60" cy="233" r="12" fill="#9198a1"/>
<text x="60" y="238" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117">1</text>
<text x="82" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#f0f6fc"><tspan font-weight="700">Predict:</tspan> everyone commits to a guess</text>
<circle cx="60" cy="269" r="12" fill="#9198a1"/>
<text x="60" y="274" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117">2</text>
<text x="82" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#f0f6fc"><tspan font-weight="700">Reveal:</tspan> the curve appears live</text>
<circle cx="60" cy="305" r="12" fill="#9198a1"/>
<text x="60" y="310" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0d1117">3</text>
<text x="82" y="310" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" fill="#f0f6fc"><tspan font-weight="700">Explain:</tspan> why interest on interest grows</text>
<text x="480" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">The reveal: €1,000 at 5% a year</text>
