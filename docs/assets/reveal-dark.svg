<path d="M484,72 h3.42 a2,2 0 0 0 1.41,-0.59 l4.71,-4.71 a3.6,3.6 0 1 0 -5.09,0 l4.71,4.71 a2,2 0 0 0 1.41,0.59 h3.42" fill="none" stroke="#2fb8b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
