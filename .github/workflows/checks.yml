name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  classroom-flow:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu and macOS are required. A Windows failure appears in its job without failing the workflow.
        # After a hosted Windows pass, move it into the os list and remove its include entry.
        # All legs run the same steps. scripts/ci_steps.py handles platform differences.
        # The README calls an OS tested only after its own hosted job passes.
        os: [ubuntu-latest, macos-latest]
        experimental: [false]
        include:
          - os: windows-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.19'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: bash -n deploy/bootstrap-vm.sh deploy/backup-vm.sh
        shell: bash
      - name: Install browser tools
        run: uv run --no-project --python 3.12 python scripts/ci_steps.py setup
      - name: Export and rehearse
        run: uv run --no-project --python 3.12 python scripts/ci_steps.py rehearse
      # Do not upload test-room screenshots: host views can contain private links.
