name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  classroom-flow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        experimental: [false]
        # Trial runs: a failure shows in its own job but does not fail the workflow.
        # macOS: required after its own job first passes. Windows: required once the CI steps are portable and its own job passes.
        # To make one required, move it into the os list above and delete its include entry. Call it tested in the README only after a required run passes.
        include:
          - os: macos-latest
            experimental: true
          - os: windows-latest
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: bash -n deploy/bootstrap-vm.sh deploy/backup-vm.sh
      - name: Install browser tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python -m unittest discover -s tests -p "test_*.py"
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Export and rehearse
        run: |
          node scripts/preview.mjs > /tmp/singularity-preview.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8787/health
          .venv/bin/python scripts/export_presentation.py
          .venv/bin/python scripts/export_speaker_pdfs.py
          .venv/bin/python scripts/qa_browser.py
          .venv/bin/python scripts/qa_race_cooperation.py
          .venv/bin/python scripts/qa_apa.py
          .venv/bin/python scripts/qa_walkthrough.py
          .venv/bin/python scripts/check_public_package.py
      # Do not upload test-room screenshots: host views can contain private links.
